apiVersion: apps/v1
kind: Deployment
metadata:
  name: payment-ms
spec:
  replicas: 2
  selector:
    matchLabels:
      app: payment-ms
  template:
    metadata:
      labels:
        app: payment-ms
    spec:
      containers:
      - name: payment-ms
        image: 975050002971.dkr.ecr.us-east-1.amazonaws.com/order-manager:latest
        ports:
        - containerPort: 3003
        livenessProbe:
          httpGet:
            path: /
            port: 3003
          initialDelaySeconds: 15
          periodSeconds: 60
        readinessProbe:
          httpGet:
            path: /
            port: 3003
          initialDelaySeconds: 15
        resources:
          requests:
            cpu: 10m
        imagePullPolicy: IfNotPresent
        env:
          - name: MONGO_CONNECTION_STRING
            valueFrom:
              configMapKeyRef:
                name: payment-ms-config
                key: MONGO_CONNECTION_STRING

---
apiVersion: v1
kind: Service
metadata:
  name: svc-payment-ms
spec:
  type: LoadBalancer
  selector:
    app: payment-ms
  ports:
    - protocol: TCP
      port: 80
      targetPort: 3003
